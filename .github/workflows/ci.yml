name: ci

# One job, because there is one command. flatpak-app-store.emb.yaml declares
# the embedder, the app, the Flutter SDK and the runtime; everything below is
# host setup around a single `emb cross`.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch: {}

env:
  # The one ref that belongs to CI rather than to the build: which emb_cli
  # builds this. A tag or branch, since `git clone --branch` will not take a sha.
  EMB_CLI_REF: main
  FLATPAK_RUNTIME_VERSION: wrynose
  # Publishes org.flatpak_minimal.Platform and .Sdk as repo-dev-<machine>
  # artifacts of its dispatched and release builds.
  FLATPAK_MINIMAL_REPO: flatpak-minimal/meta-flatpak-minimal

jobs:
  flatpak:
    name: "Flatpak (${{ matrix.arch }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            machine: qemux86-64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            machine: qemuarm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      # apt rather than `emb deps`: emb's package backend is PackageKit and
      # hosted runners have no PackageKit daemon.
      - name: Install host build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -yq --no-install-recommends \
            pkg-config libegl-dev libgles2-mesa-dev libdrm-dev libgbm-dev \
            libinput-dev libxkbcommon-dev libwayland-dev wayland-protocols \
            libudev-dev libasio-dev libflatpak-dev libglib2.0-dev \
            libpugixml-dev libseat-dev libdisplay-info-dev libxcursor-dev \
            elfutils flatpak flatpak-builder

      # emb needs flatpak-builder to build the bundle, and the runtime itself to
      # know which libraries it already provides (package.flatpak.vendor_libs).
      - name: Install the flatpak runtime
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: repo-dev-${{ matrix.machine }}
        run: |
          set -euo pipefail
          # The newest artifact from master; they expire after 7 days.
          run=$(gh api "repos/$FLATPAK_MINIMAL_REPO/actions/artifacts?name=$ARTIFACT&per_page=20" \
            --jq '[.artifacts[] | select(.expired | not) | select(.workflow_run.head_branch == "master")][0].workflow_run.id // empty')
          if [ -z "$run" ]; then
            echo "::error::no unexpired $ARTIFACT artifact from master in $FLATPAK_MINIMAL_REPO; dispatch its $FLATPAK_RUNTIME_VERSION build"
            exit 1
          fi
          gh run download "$run" -R "$FLATPAK_MINIMAL_REPO" -n "$ARTIFACT" -D "$RUNNER_TEMP"
          tar -C "$RUNNER_TEMP" -xf "$RUNNER_TEMP/$ARTIFACT.tar"
          rm "$RUNNER_TEMP/$ARTIFACT.tar"
          # Not verified, but fetched through the GitHub API from our own build.
          flatpak remote-add --if-not-exists --user --no-gpg-verify flatpak-minimal \
            "file://$RUNNER_TEMP/repo-dev"
          flatpak install --user -y --noninteractive flatpak-minimal \
            "org.flatpak_minimal.Platform//${FLATPAK_RUNTIME_VERSION}" \
            "org.flatpak_minimal.Sdk//${FLATPAK_RUNTIME_VERSION}"

      - name: Bootstrap emb_cli
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$EMB_CLI_REF" \
            https://github.com/toyota-connected/emb_cli.git "$RUNNER_TEMP/emb_cli"
          eval "$("$RUNNER_TEMP/emb_cli/bootstrap.sh" --shellenv)"
          dirname "$(command -v emb)" >> "$GITHUB_PATH"

      - name: Build the flatpak
        run: emb cross flatpak-app-store.emb.yaml --target local --build --flatpak

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-${{ matrix.arch }}
          path: staging/emb-workspace/.config/flutter_workspace/**/dist/*.flatpak
          if-no-files-found: error

      - name: Deploy to flat-manager
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: flatpak/flatpak-github-actions/flat-manager@v6
        with:
          repository: ${{ vars.FLAT_MANAGER_REPOSITORY }}
          flat-manager-url: ${{ secrets.FLAT_MANAGER_URL }}
          token: ${{ secrets.FLAT_MANAGER_TOKEN }}

  release:
    needs: flatpak
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: flatpak-*
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s failglob
          prerelease=()
          [[ "${{ github.ref_name }}" == *-* ]] && prerelease=(--prerelease)
          gh release create "${{ github.ref_name }}" \
            flatpak-x86_64/cross-build-*/dist/*.flatpak \
            flatpak-aarch64/cross-build-*/dist/*.flatpak \
            --generate-notes "${prerelease[@]}"
