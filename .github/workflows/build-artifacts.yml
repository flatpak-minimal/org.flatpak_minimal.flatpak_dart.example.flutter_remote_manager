name: build-artifacts

on:
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v5

      - name: Load versions.env
        run: cat versions.env >> "$GITHUB_ENV"

      - name: Checkout the app at pinned ref
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ env.APP_REF }}
          path: app
          fetch-depth: 1
          persist-credentials: false

      - name: Build homescreen
        id: homescreen
        uses: ./.github/actions/build-homescreen
        with:
          homescreen-ref: ${{ env.IVI_HOMESCREEN_REF }}
          emb-cli-ref: ${{ env.EMB_CLI_REF }}
          emb-target: ${{ env.EMB_TARGET }}

      - name: Resolve per-arch build paths
        id: arch-paths
        run: |
          echo "homescreen_bin=${{ steps.homescreen.outputs.homescreen-bin }}" >> "$GITHUB_OUTPUT"
          echo "ihs_shared_dir=${{ steps.homescreen.outputs.ihs-shared-dir }}" >> "$GITHUB_OUTPUT"
          echo "wayland_lib_dir=/usr/lib/$(uname -m)-linux-gnu" >> "$GITHUB_OUTPUT"

      - name: Provision Flutter SDK
        run: emb flutter --flutter-version "${{ env.FLUTTER_VERSION }}"

      - name: Provision Flutter engine
        run: emb engine --mode release --target "${{ env.EMB_TARGET }}"

      - name: Build Flutter bundle
        env:
          APP_DIR: ${{ github.workspace }}/app
        run: ./scripts/01-build-flutter-bundle.sh

      - name: Discover + stage vendor libs
        env:
          HOMESCREEN_BIN: ${{ steps.arch-paths.outputs.homescreen_bin }}
          IHS_SHARED_DIR: ${{ steps.arch-paths.outputs.ihs_shared_dir }}
          AGL_LIB_DIR: ${{ steps.arch-paths.outputs.wayland_lib_dir }}
          TOOLCHAIN_LIB_DIR: ${{ steps.homescreen.outputs.toolchain-lib-dir }}
        run: |
          ./scripts/02-discover-vendor-libs.sh
          ./scripts/03-stage-vendor-libs.sh

      - name: Package artifact tarballs
        env:
          FLATPAK_ARCH: ${{ matrix.arch }}
        run: ./scripts/06-publish-artifacts.sh

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view artifacts >/dev/null 2>&1 || \
            gh release create artifacts --title "Build artifacts" --notes "Prebuilt homescreen + Flutter bundle tarballs consumed by org.flatpak_minimal.flatpak_dart.example.flutter_remote_manager.yml. Not a user-facing release." --prerelease
          gh release upload artifacts artifacts/*.tar.xz artifacts/SHA256SUMS-*.txt --clobber

      - name: Print sha256 for manifest pinning
        run: cat artifacts/SHA256SUMS-*.txt
