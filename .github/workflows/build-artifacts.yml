name: build-artifacts

on:
  workflow_dispatch: {}

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v5

      - name: Load versions.env
        run: cat versions.env >> "$GITHUB_ENV"

      - name: Checkout the app at pinned ref
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ env.APP_REF }}
          path: app
          fetch-depth: 1
          persist-credentials: false

      - name: Set up emb_cli and ivi-homescreen
        id: setup
        uses: ./.github/actions/build-homescreen
        with:
          homescreen-ref: ${{ env.IVI_HOMESCREEN_REF }}
          emb-cli-ref: ${{ env.EMB_CLI_REF }}

      - name: Provision Flutter SDK
        env:
          FLUTTER_WORKSPACE: ${{ github.workspace }}/staging/emb-workspace
        run: |
          mkdir -p "$FLUTTER_WORKSPACE"
          emb flutter --flutter-version "${{ env.FLUTTER_VERSION }}"

      - name: Build embedder + app bundle
        env:
          APP_DIR: ${{ github.workspace }}/app
          IHS_DIR: ${{ steps.setup.outputs.ihs-dir }}
          EMB_TARGET: ${{ env.EMB_TARGET }}
        run: ./scripts/01-build-flutter-bundle.sh

      - name: Install flatpak runtime for dependency comparison
        run: |
          set -euo pipefail
          sudo apt-get install -yq --no-install-recommends flatpak
          flatpak remote-add --if-not-exists --user flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive \
            "org.freedesktop.Platform//${{ env.FLATPAK_RUNTIME_VERSION }}"

      - name: Discover + stage vendor libs
        run: |
          ./scripts/02-discover-vendor-libs.sh
          ./scripts/03-stage-vendor-libs.sh

      - name: Package artifact tarballs
        env:
          FLATPAK_ARCH: ${{ matrix.arch }}
        run: ./scripts/06-publish-artifacts.sh

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view artifacts >/dev/null 2>&1 || \
            gh release create artifacts --title "Build artifacts" --notes "Prebuilt homescreen + Flutter bundle tarballs consumed by org.flatpak_minimal.flatpak_dart.example.flutter_remote_manager.yml. Not a user-facing release." --prerelease
          gh release upload artifacts artifacts/*.tar.xz artifacts/SHA256SUMS-*.txt --clobber

      - name: Print sha256 for manifest pinning
        run: cat artifacts/SHA256SUMS-*.txt
