# The whole packaging pipeline for the Flutter Remote Manager flatpak.
#
# There is nothing else to run. One invocation clones the embedder and the app
# at the revisions declared below, provisions the Flutter SDK, cross-builds
# ivi-homescreen, builds the app (including the Dart build hooks that produce
# flatpak_dart's FFI libraries), assembles the runnable bundle, vendors what
# org.freedesktop.Platform does not ship, and emits a single-file .flatpak:
#
#   emb cross flatpak-app-store.emb.yaml --target local --build --flatpak
#
# `icon:` resolves against this file's directory, so the assets stay here while
# the build happens in the checkout emb makes under workspace: below.
id: flatpak-app-store
type: app
supported_archs: [arm64, x86_64]
supported_host_types: [ubuntu, fedora]

# emb reuses whatever engine artifacts it finds in a workspace, and an engine
# from an unrelated SDK mismatches gen_snapshot and dies at Dart VM init rather
# than at build time. Pinning the workspace here keeps a stray inherited
# FLUTTER_WORKSPACE out of the build. `-w` still overrides, deliberately.
workspace: staging/emb-workspace

# Provisioned into that workspace when it holds no SDK yet.
flutter_version: 3.44.2

cross:
  provider: arm-gnu              # required to parse; ignored for --target local

  # The embedder, tracking the tip of its default branch. `rev:` here would
  # pin it instead, and takes precedence over `branch:` when both are set.
  source:
    uri: https://github.com/toyota-connected/ivi-homescreen.git
    branch: v3.0

  # The app. A commit sha rather than a branch, so an unrelated commit cannot
  # drift into a build. `--app <dir>` overrides this for local work.
  app:
    uri: https://github.com/flatpak-minimal/flutter_remote_manager.git
    branch: main 

  defines:
    DISABLE_PLUGINS: 'ON'
    # agl_shell may only be bound by one client, and on a real AGL image the
    # launcher already owns it, so binding it aborts the whole connection. This
    # app runs alongside the launcher, so compile that client out and use xdg.
    ENABLE_AGL_SHELL_CLIENT: 'OFF'
    ENABLE_XDG_CLIENT: 'ON'
  backends:
    # One backend only: it keeps the app id unsuffixed and the runnable dir
    # plain `runnable/`. A second entry here is all another backend needs.
    wayland-egl:
      BUILD_BACKEND_WAYLAND_EGL: 'ON'
      BUILD_BACKEND_WAYLAND_VULKAN: 'OFF'

  package:
    name: Flutter Remote Manager
    version: 1.0.0
    bin: shell/homescreen
    # No `files:` entry for the appdata. It is kept beside this manifest as the
    # app's metadata of record, but installing it into /app/share/metainfo makes
    # flatpak-builder run appstream-compose, which the freedesktop SDK does not
    # ship, and the build fails.
    flatpak:
      app_id: org.flatpak_minimal.flatpak_dart.example.flutter_remote_manager
      runtime: org.freedesktop.Platform
      runtime_version: '25.08'
      sdk: org.freedesktop.Sdk
      icon: org.flatpak_minimal.flatpak_dart.example.flutter_remote_manager.png
      categories: [System, PackageManager]
      # The runtime is not the sysroot: emb walks the bundle's DT_NEEDED closure
      # (embedder, engine, and the build hooks' code assets), subtracts what the
      # runtime provides, copies the rest into lib/, and puts lib/ on the
      # launcher's LD_LIBRARY_PATH.
      vendor_libs: auto
      env:
        IHS_LOG_LEVEL: info
        # The runtime's GIO tries to talk to a proxy resolver over the session
        # bus that this sandbox has no portal for; the dummy resolver skips it.
        GIO_USE_PROXY_RESOLVER: dummy
        XDG_DATA_HOME: $HOME/.local/share
      args:
        - --backend=wayland-egl
        - --shell=xdg
        - --app-id=org.flatpak_minimal.flatpak_dart.example.flutter_remote_manager
      finish_args:
        - --socket=wayland
        - --device=dri
        - --share=network
        # The app manages flatpaks on the host: it needs the system bus, the
        # Flatpak name, and read access to both installation roots.
        - --socket=session-bus
        - --socket=system-bus
        - --talk-name=org.freedesktop.Flatpak
        - --filesystem=~/.local/share/flatpak
        - --filesystem=/var/lib/flatpak:ro
