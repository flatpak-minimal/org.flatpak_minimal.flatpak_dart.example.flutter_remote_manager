app-id: org.flatpak_minimal.flatpak_dart.example.flutter_remote_manager
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: flatpak-app-store

finish-args:
  - --socket=wayland
  - --device=dri

  - --share=network

  - --socket=session-bus
  - --socket=system-bus
  - --talk-name=org.freedesktop.Flatpak

  - --filesystem=~/.local/share/flatpak
  - --filesystem=/var/lib/flatpak:ro

modules:
  - name: homescreen-bin
    buildsystem: simple
    build-commands:
      - install -Dm755 homescreen/bin/homescreen /app/bin/homescreen
      - mkdir -p /app/lib
      - sh -c 'for f in homescreen/lib/*; do cp -a "$f" "/app/lib/$(basename "$f")"; done'
      - install -Dm755 flatpak-app-store.sh /app/bin/flatpak-app-store
    sources:
      - type: archive
        url: https://github.com/flatpak-minimal/org.flatpak_minimal.flatpak_dart.example.flutter_remote_manager/releases/download/artifacts/homescreen-aarch64.tar.xz
        sha256: "a476fb48818349f48986ec9e8c9d3c43143a598f5569e68937bb6723b62c2bfa"
        only-arches: [aarch64]
        dest: homescreen
        strip-components: 0
      - type: archive
        url: https://github.com/flatpak-minimal/org.flatpak_minimal.flatpak_dart.example.flutter_remote_manager/releases/download/artifacts/homescreen-x86_64.tar.xz
        sha256: "1ed7e618b5b539c29567952b80bd95ebac9012855bb2b1ae1898db0fa7cf99fb"
        only-arches: [x86_64]
        dest: homescreen
        strip-components: 0
      - type: file
        path: flatpak-app-store.sh

  - name: app-bundle
    buildsystem: simple
    build-commands:
      - mkdir -p /app/share/flatpak-app-store/bundle
      - cp -a bundle/. /app/share/flatpak-app-store/bundle/
    sources:
      - type: archive
        url: https://github.com/flatpak-minimal/org.flatpak_minimal.flatpak_dart.example.flutter_remote_manager/releases/download/artifacts/flutter-bundle-aarch64.tar.xz
        sha256: "df9e4065187c5971d5d97f885cac1f15c2c7c4a91b3ca54b2738a1af4f532dc2"
        only-arches: [aarch64]
        dest: bundle
        strip-components: 0
      - type: archive
        url: https://github.com/flatpak-minimal/org.flatpak_minimal.flatpak_dart.example.flutter_remote_manager/releases/download/artifacts/flutter-bundle-x86_64.tar.xz
        sha256: "0769d02ccd9d0b93751525d0dc33ca02a8af05c1d4d5cbd57765eb2611344ff1"
        only-arches: [x86_64]
        dest: bundle
        strip-components: 0

  - name: desktop-metadata
    buildsystem: simple
    build-commands:
      - install -Dm644 org.flatpak_minimal.flatpak_dart.example.flutter_remote_manager.desktop /app/share/applications/org.flatpak_minimal.flatpak_dart.example.flutter_remote_manager.desktop
      - install -Dm644 icons/org.flatpak_minimal.flatpak_dart.example.flutter_remote_manager.png /app/share/icons/hicolor/128x128/apps/org.flatpak_minimal.flatpak_dart.example.flutter_remote_manager.png
    sources:
      - type: file
        path: org.flatpak_minimal.flatpak_dart.example.flutter_remote_manager.desktop
      - type: dir
        path: icons
        dest: icons
