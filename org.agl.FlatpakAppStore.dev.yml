# DEV MANIFEST — local-directory sources, requires scripts/01-04 to have
# already populated staging/ on this machine. Used for local iteration and
# the dev-only GPU vendoring workaround (VENDOR_DEV_GPU_STACK=1).
#
# CI/production builds use org.agl.FlatpakAppStore.yml instead — a
# network-native manifest with no local staging dependency, fetching pinned
# per-arch artifact tarballs, built via flatpak/flatpak-github-actions.
app-id: org.agl.FlatpakAppStore
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: flatpak-app-store

finish-args:
  # Wayland/EGL rendering — homescreen is a wayland-egl-only shell, no X11 fallback.
  - --socket=wayland
  - --device=dri

  # libflatpak needs to reach flathub/remotes to install/update apps.
  - --share=network

  # --- D-Bus / portal access -------------------------------------------------
  # The bundled flatpak-management plugin calls D-Bus portal interfaces
  # (org.freedesktop.impl.portal.PermissionStore, org.freedesktop.portal.Request)
  # directly rather than via `flatpak-spawn --host`, so a broad session-bus
  # grant is required for a first working build. TODO(harden): once the exact
  # bus traffic is confirmed via `busctl monitor`, replace this with narrow
  # --talk-name=... entries and drop --socket=session-bus.
  - --socket=session-bus
  - --socket=system-bus
  - --talk-name=org.freedesktop.Flatpak

  # --- Filesystem access -------------------------------------------------
  # libflatpak/ostree are called in-process (not through a portal) and touch
  # the host user's flatpak data directory directly. This is the main
  # sandbox-weakening grant in this manifest — acceptable for a single-app
  # IVI kiosk context, but should be called out to reviewers explicitly.
  - --filesystem=~/.local/share/flatpak
  # The FlatpakPlugin queries both user and system installations; without
  # visibility into the system one it hits an error path that crashes rather
  # than degrading gracefully (see README). Read-only since we only need to
  # query it, not modify it.
  - --filesystem=/var/lib/flatpak:ro

modules:
  - name: homescreen-bin
    buildsystem: simple
    build-commands:
      - install -Dm755 vendor-bin/homescreen /app/bin/homescreen
      - mkdir -p /app/lib
      - sh -c 'for f in vendor-lib/*; do cp -a "$f" "/app/lib/$(basename "$f")"; done'
      - install -Dm755 flatpak-app-store.sh /app/bin/flatpak-app-store
      # Only present when the dev-only GPU vendoring profile was staged
      # (VENDOR_DEV_GPU_STACK=1, see scripts/03-stage-vendor-libs.sh) — a
      # no-op on production builds.
      - sh -c 'test -f mesa-json/50_mesa.json && install -Dm644 mesa-json/50_mesa.json /app/lib/50_mesa.json || true'
    sources:
      - type: dir
        path: staging/vendor-bin
        dest: vendor-bin
      - type: dir
        path: staging/vendor-lib
        dest: vendor-lib
      - type: file
        path: flatpak-app-store.sh
      - type: dir
        path: staging/mesa-json
        dest: mesa-json

  - name: app-bundle
    buildsystem: simple
    build-commands:
      - mkdir -p /app/share/flatpak-app-store/bundle
      - cp -a bundle/. /app/share/flatpak-app-store/bundle/
    sources:
      - type: dir
        path: staging/bundle
        dest: bundle

  - name: desktop-metadata
    buildsystem: simple
    build-commands:
      - install -Dm644 org.agl.FlatpakAppStore.desktop /app/share/applications/org.agl.FlatpakAppStore.desktop
      - install -Dm644 icons/org.agl.FlatpakAppStore.png /app/share/icons/hicolor/128x128/apps/org.agl.FlatpakAppStore.png
    sources:
      - type: file
        path: org.agl.FlatpakAppStore.desktop
      - type: dir
        path: icons
        dest: icons
    # org.agl.FlatpakAppStore.appdata.xml is intentionally not installed here:
    # flatpak-builder's automatic AppStream compose step needs
    # `appstream-compose`, which org.freedesktop.Sdk//25.08 doesn't ship (only
    # `appstreamcli`). Not required for a --user install/launch; revisit if
    # this is ever submitted to a Flatpak repo that validates AppStream data.
